name: CI/CD to Hugging Face

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          python prepare_data.py
          python -m unittest discover tests

      - name: Cleanup Cache and Logs
        run: |
          find . -type d -name "__pycache__" -exec rm -rf {} +
          find . -type f -name "*.log" -delete
          echo "Cleanup of __pycache__ and .log files completed."

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git remote add hf https://tahatehrani:$HF_TOKEN@huggingface.co/spaces/tahatehrani/nlp-segment-analysis
          # push command:
          git push --force hf main
