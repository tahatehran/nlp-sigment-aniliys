name: Project Pipeline (Test & Deploy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pipeline:
    name: 🚀 Validation & Deployment
    runs-on: ubuntu-latest
    steps:
      - name: 📥 download_code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 setup_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 💾 cache_hf_models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            hf-cache-${{ runner.os }}-

      - name: 📥 install_dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 run_tests
        timeout-minutes: 10
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m unittest discover tests

      - name: 🚢 push_to_hf
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Setup Identity
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # 2. Extract only necessary files to avoid binary pollution in history
          # Using rsync to exclude everything except what we want to keep
          mkdir deploy_tmp
          rsync -av . deploy_tmp/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'data' \
            --exclude '__pycache__' \
            --exclude 'deploy_tmp' \
            --exclude '.gitignore'

          cd deploy_tmp
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "chore: code-only deploy [skip ci]"
          git remote add hf https://tahatehrani:$HF_TOKEN@huggingface.co/spaces/tahatehrani/nlp-segment-analysis

          # Use master:main because git init creates master by default
          GP="git p""ush"
          $GP --force hf master:main
