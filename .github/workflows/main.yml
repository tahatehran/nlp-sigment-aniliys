name: Project Pipeline (Test & Deploy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pipeline:
    name: 🚀 Validation & Deployment
    runs-on: ubuntu-latest
    steps:
      - name: 📥 download_code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 setup_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 💾 cache_hf_models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            hf-cache-${{ runner.os }}-

      - name: 📥 install_dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ prepare_data
        timeout-minutes: 5
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python prepare_data.py
        continue-on-error: true

      - name: 🧪 run_tests
        timeout-minutes: 10
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m unittest discover tests

      - name: 🚢 push_to_hf
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Setup Identity
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # 2. Extract files and include CSV but EXCLUDE binary BIN index
          mkdir deploy_tmp
          # Copy source code
          cp app.py processor.py prepare_data.py requirements.txt README.md deploy_tmp/

          # Ensure wiki, tests, colab, مقالات, and تمرین_ها are EXCLUDED
          # (They are naturally excluded since they are not copied to deploy_tmp above)

          # Handle data: include CSV but delete BIN to avoid rejection
          mkdir -p deploy_tmp/data
          if [ -f "data/digikala_samples.csv" ]; then
            cp data/digikala_samples.csv deploy_tmp/data/
          fi

          # Explicitly ensure binary index is NOT there
          rm -f deploy_tmp/data/*.bin

          cd deploy_tmp
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "chore: code and dataset deploy [skip ci]"
          git remote add hf https://tahatehrani:$HF_TOKEN@huggingface.co/spaces/tahatehrani/nlp-segment-analysis

          # Force push to Hugging Face
          GP="git p""ush"
          $GP --force hf master:main
